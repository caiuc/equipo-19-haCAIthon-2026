<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EduFlow - Create Class</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#261a00",
                        "border": "#1E293B",
                        "secondary": "#545f73",
                        "surface-variant": "#e4e3db",
                        "primary-fixed-dim": "#bec2ff",
                        "success": "#34D399",
                        "surface-bright": "#fbf9f1",
                        "background": "#fbf9f1",
                        "secondary-fixed-dim": "#bcc7de",
                        "surface-dim": "#dcdad2",
                        "on-error-container": "#93000a",
                        "on-surface-variant": "#454655",
                        "tertiary-container": "#956f00",
                        "secondary-container": "#d5e0f8",
                        "surface-container-high": "#eae8e0",
                        "inverse-surface": "#30312c",
                        "inverse-on-surface": "#f3f1e9",
                        "on-error": "#ffffff",
                        "muted": "#64748B",
                        "tertiary-fixed": "#ffdf9f",
                        "on-surface": "#1E293B",
                        "secondary-fixed": "#d8e3fb",
                        "primary-container": "#5865f2",
                        "on-primary-container": "#fffdff",
                        "on-primary-fixed-variant": "#222fc2",
                        "on-primary-fixed": "#000569",
                        "surface": "#FFFFFF",
                        "outline": "#767686",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed-variant": "#5c4300",
                        "error-container": "#ffdad6",
                        "surface-container-highest": "#e4e3db",
                        "primary": "#3d4ad8",
                        "tertiary-fixed-dim": "#f9bd22",
                        "tertiary": "#775700",
                        "accent-purple": "#8B5CF6",
                        "on-primary": "#ffffff",
                        "surface-tint": "#3f4cda",
                        "accent-pink": "#F472B6",
                        "on-tertiary-container": "#fffdff",
                        "on-secondary-fixed": "#111c2d",
                        "primary-fixed": "#e0e0ff",
                        "surface-container-low": "#f5f4ec",
                        "error": "#EF4444",
                        "outline-variant": "#c6c5d7",
                        "inverse-primary": "#bec2ff",
                        "on-secondary-container": "#586377",
                        "on-secondary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed-variant": "#3c475a",
                        "surface-container": "#f0eee6",
                        "on-background": "#1b1c17",
                        "accent-blue": "#60A5FA"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "2rem",
                        "lg": "4rem",
                        "sm": "1rem",
                        "section": "6rem",
                        "gutter": "1.5rem",
                        "xl": "6rem",
                        "xs": "0.5rem"
                    },
                    "fontFamily": {
                        "label-lg": ["Outfit"],
                        "body-md": ["Plus Jakarta Sans"],
                        "headline-display": ["Outfit"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Outfit"],
                        "headline-lg": ["Outfit"],
                        "body-sm": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "caption": ["Plus Jakarta Sans"],
                        "headline-sm": ["Outfit"],
                        "label-md": ["Outfit"],
                        "headline-md": ["Outfit"]
                    },
                    "fontSize": {
                        "label-lg": ["18px", { "lineHeight": "24px", "letterSpacing": "0.01em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "letterSpacing": "0px", "fontWeight": "500" }],
                        "headline-display": ["72px", { "lineHeight": "72px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "body-lg": ["20px", { "lineHeight": "28px", "letterSpacing": "0px", "fontWeight": "500" }],
                        "headline-lg-mobile": ["32px", { "lineHeight": "40px", "letterSpacing": "0px", "fontWeight": "700" }],
                        "headline-lg": ["52px", { "lineHeight": "62px", "letterSpacing": "0px", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "letterSpacing": "0px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "600" }],
                        "caption": ["12px", { "lineHeight": "16px", "letterSpacing": "0px", "fontWeight": "500" }],
                        "headline-sm": ["28px", { "lineHeight": "28px", "letterSpacing": "0px", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "700" }],
                        "headline-md": ["38px", { "lineHeight": "46px", "letterSpacing": "0px", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .pulse-shadow { box-shadow: 4px 4px 0px 0px rgba(251, 191, 36, 1); }
        .pulse-shadow-hover:hover { box-shadow: 8px 8px 0px 0px rgba(251, 191, 36, 1); transform: translate(-2px, -2px); }
        
        .custom-input {
            height: 60px;
            border-radius: 9999px;
            border: 2px solid #1E293B;
            background-color: #FFFFFF;
            padding: 0 1.5rem;
            transition: all 0.2s ease;
        }
        .custom-input:focus {
            outline: none;
            box-shadow: 4px 4px 0px 0px rgba(251, 191, 36, 1);
        }
        
        .custom-textarea {
            border-radius: 1rem;
            border: 2px solid #1E293B;
            background-color: #FFFFFF;
            padding: 1rem 1.5rem;
            transition: all 0.2s ease;
        }
        .custom-textarea:focus {
            outline: none;
            box-shadow: 4px 4px 0px 0px rgba(251, 191, 36, 1);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen font-body-md selection:bg-primary-container selection:text-on-primary-container flex">
<!-- SideNavBar (Suppressed based on Semantic Shell Mandate for Transactional Screen) -->
<!-- Creating a class is a linear/transactional task, so we hide the main nav to focus on the canvas -->
<!-- Main Content Canvas -->
<main class="flex-1 max-w-[1280px] mx-auto w-full min-h-screen flex flex-col p-gutter md:p-section relative">
<!-- Header -->
<header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-lg gap-sm">
<div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">Create New Class</h1>
<p class="font-body-lg text-body-lg text-secondary mt-xs">Set up a new space for your students.</p>
</div>
<div class="flex items-center gap-sm mt-sm md:mt-0 w-full md:w-auto">
<button class="flex-1 md:flex-none h-[60px] px-lg rounded-full border-2 border-border text-border font-label-md text-label-md bg-transparent hover:bg-surface-container-low transition-colors duration-200">
                    Cancel
                </button>
<button class="flex-1 md:flex-none h-[60px] px-lg rounded-full bg-primary-container text-on-primary-container font-label-md text-label-md border-2 border-border pulse-shadow pulse-shadow-hover transition-all duration-200">
                    Create Class
                </button>
</div>
</header>
<!-- Main Form Card -->
<div class="bg-surface border-2 border-border rounded-xl p-md md:p-lg pulse-shadow relative">
<form class="flex flex-col gap-lg max-w-3xl">
<!-- Basic Info Section -->
<div class="flex flex-col gap-sm">
<label class="font-label-lg text-label-lg text-on-surface" for="className">Class Name</label>
<input class="custom-input font-body-md text-body-md text-on-surface w-full" id="className" placeholder="e.g. Advanced Biology 101" type="text"/>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-sm">
<div class="flex flex-col gap-sm">
<label class="font-label-lg text-label-lg text-on-surface" for="subject">Subject</label>
<div class="relative">
<select class="custom-input font-body-md text-body-md text-on-surface w-full appearance-none pr-lg cursor-pointer" id="subject">
<option disabled="" selected="" value="">Select subject</option>
<option value="math">Mathematics</option>
<option value="science">Science</option>
<option value="english">Language Arts</option>
<option value="history">History</option>
<option value="art">Art &amp; Design</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-border pointer-events-none">expand_more</span>
</div>
</div>
<div class="flex flex-col gap-sm">
<label class="font-label-lg text-label-lg text-on-surface" for="grade">Grade Level</label>
<div class="relative">
<select class="custom-input font-body-md text-body-md text-on-surface w-full appearance-none pr-lg cursor-pointer" id="grade">
<option disabled="" selected="" value="">Select grade</option>
<option value="9">9th Grade</option>
<option value="10">10th Grade</option>
<option value="11">11th Grade</option>
<option value="12">12th Grade</option>
<option value="univ">University</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-border pointer-events-none">expand_more</span>
</div>
</div>
</div>
<div class="flex flex-col gap-sm">
<label class="font-label-lg text-label-lg text-on-surface" for="description">Description (Optional)</label>
<textarea class="custom-textarea font-body-md text-body-md text-on-surface w-full resize-y" id="description" placeholder="Briefly describe what this class is about..." rows="4"></textarea>
</div>
<!-- Theme Selection -->
<div class="flex flex-col gap-sm">
<label class="font-label-lg text-label-lg text-on-surface">Class Theme</label>
<div class="flex flex-wrap gap-xs">
<button aria-label="Purple Theme" class="w-12 h-12 rounded-full border-2 border-border bg-accent-purple pulse-shadow-hover transition-all relative overflow-hidden" type="button">
<!-- Example active state indicator -->
<div class="absolute inset-0 flex items-center justify-center bg-black/20 opacity-0 hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-white text-sm" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</button>
<button aria-label="Blue Theme" class="w-12 h-12 rounded-full border-2 border-border bg-accent-blue hover:scale-105 transition-transform" type="button"></button>
<button aria-label="Green Theme" class="w-12 h-12 rounded-full border-2 border-border bg-success hover:scale-105 transition-transform" type="button"></button>
<button aria-label="Pink Theme" class="w-12 h-12 rounded-full border-2 border-border bg-accent-pink hover:scale-105 transition-transform" type="button"></button>
<button aria-label="Yellow Theme" class="w-12 h-12 rounded-full border-2 border-border bg-tertiary-fixed-dim hover:scale-105 transition-transform" type="button"></button>
<button aria-label="Custom Color" class="w-12 h-12 rounded-full border-2 border-border bg-surface-variant flex items-center justify-center hover:bg-surface-container-high transition-colors" type="button">
<span class="material-symbols-outlined text-border">add</span>
</button>
</div>
</div>
<!-- Info Box -->
<div class="mt-md bg-secondary-fixed border-2 border-border rounded-xl p-md flex items-start gap-sm">
<div class="bg-primary-container text-on-primary-container p-2 rounded-full border-2 border-border shrink-0 mt-1">
<span class="material-symbols-outlined block" style="font-size: 20px;">lock</span>
</div>
<div>
<h4 class="font-label-md text-label-md text-on-surface">Auto-Generated Access</h4>
<p class="font-body-sm text-body-sm text-secondary mt-1">A unique class code will be generated automatically upon creation. Students will need this code to join your roster.</p>
</div>
</div>
</form>
<!-- Decorative Elements -->
<div class="absolute -top-4 -right-4 w-24 h-24 bg-tertiary-fixed-dim rounded-full border-2 border-border -z-10 blur-xl opacity-50 hidden md:block"></div>
<div class="absolute -bottom-8 -left-8 w-32 h-32 bg-primary-fixed-dim rounded-full border-2 border-border -z-10 blur-xl opacity-50 hidden md:block"></div>
</div>
</main>
</body></html>
