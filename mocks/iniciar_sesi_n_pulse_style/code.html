<!DOCTYPE html>

<html class="h-full" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Iniciar Sesión - Pulse Style</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

            darkMode: "class",

                extend: {
                    "colors": {

                        "accent-pink": "#F472B6",
                        "on-tertiary": "#ffffff",
                        "muted": "#64748B",

                    "borderRadius": {

                        "xl": "0.75rem",

                    "spacing": {
                        "section": "6rem",
                        "xs": "0.5rem",

<style>
        .pulse-shadow {
            box-shadow: 4px 4px 0px 0px #FBBF24;
        }
        .pulse-shadow-hover:hover {
            box-shadow: 8px 8px 0px 0px #FBBF24;
            transform: translate(-2px, -2px);
        }
        .pulse-input:focus-within {
            box-shadow: inset 4px 4px 0px 0px #FBBF24;
        }
    </style>
</head>
<body class="h-full bg-background flex items-center justify-center p-gutter">
<!-- Login Canvas -->
<main class="w-full max-w-[480px]">
<!-- Brand Logo -->
<div class="flex justify-center mb-md">
<h1 class="font-headline-md text-headline-md font-black text-on-surface">EduFlow</h1>
</div>
<!-- Login Card -->
<div class="bg-surface border-2 border-border rounded-xl p-[32px] pulse-shadow">
<!-- Headline -->
<div class="text-center mb-lg">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-xs">Bienvenido a EduFlow</h2>
<p class="font-body-md text-body-md text-secondary">La plataforma para creadores y educadores.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-sm">
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface uppercase" for="email">Correo Electrónico</label>
<div class="relative flex items-center bg-surface border-2 border-border rounded-full h-[60px] px-4 pulse-input transition-all duration-200">
<span aria-hidden="true" class="material-symbols-outlined text-secondary mr-3">mail</span>
<input class="w-full bg-transparent border-none focus:ring-0 p-0 font-body-md text-body-md text-on-surface placeholder:text-outline-variant outline-none" id="email" name="email" placeholder="tu@email.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface uppercase" for="password">Contraseña</label>
<a class="font-caption text-caption text-primary hover:underline" href="#">¿Olvidaste tu contraseña?</a>
</div>
<div class="relative flex items-center bg-surface border-2 border-border rounded-full h-[60px] px-4 pulse-input transition-all duration-200">
<span aria-hidden="true" class="material-symbols-outlined text-secondary mr-3">lock</span>
<input class="w-full bg-transparent border-none focus:ring-0 p-0 font-body-md text-body-md text-on-surface placeholder:text-outline-variant outline-none" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="mt-md bg-primary-container text-on-primary-container border-2 border-border rounded-full h-[60px] flex items-center justify-center gap-2 pulse-shadow pulse-shadow-hover transition-all duration-200 w-full" type="submit">
<span class="font-label-md text-label-md">Iniciar Sesión</span>
<span aria-hidden="true" class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</form>
<!-- Secondary Actions -->
<div class="mt-lg text-center border-t border-outline-variant pt-md">
<p class="font-body-sm text-body-sm text-secondary">
                    ¿No tienes una cuenta? 
                    <a class="font-label-md text-label-md text-primary hover:underline ml-1" href="#">Regístrate aquí</a>
</p>
</div>
</div>
</main>
</body></html>
