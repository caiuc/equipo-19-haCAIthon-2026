<body class="bg-background h-full w-full flex flex-col font-body-md text-on-background">
<!-- Linear/Transactional Page - TopNav hidden, replaced by minimal top bar -->
<header class="w-full flex justify-between items-center px-gutter h-20 max-w-5xl mx-auto flex-shrink-0">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-on-surface hover:bg-surface-container p-xs rounded-full cursor-pointer transition-colors" data-icon="close">close</span>
<span class="font-headline-sm text-headline-sm font-bold text-on-surface">EduFlow</span>
</div>
<!-- Offline Indicator -->
<div class="flex items-center gap-2 px-3 py-1.5 rounded-full border-2 border-secondary bg-surface text-secondary">
<span class="material-symbols-outlined text-[16px]" data-icon="cloud_off">cloud_off</span>
<span class="font-label-sm text-label-sm">Offline</span>
</div>
</header>
<main class="flex-grow flex flex-col w-full max-w-3xl mx-auto px-gutter pb-xl overflow-y-auto">
<!-- Progress Bar -->
<div class="w-full mb-lg mt-md">
<div class="flex justify-between items-center mb-xs">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Question 4 of 10</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">40%</span>
</div>
<div class="w-full h-4 bg-surface rounded-full border-2 border-border overflow-hidden">
<div class="h-full bg-success w-[40%] transition-all duration-500 ease-out border-r-2 border-border" style="border-radius: 0;"></div>
</div>
</div>
<!-- Quiz Container -->
<div class="bg-surface border-2 border-border rounded-xl p-md shadow-[6px_6px_0px_0px_#FBBF24] flex flex-col gap-lg">
<!-- Question -->
<div>
<span class="inline-block px-3 py-1 rounded-full border-2 border-primary text-primary font-label-sm text-label-sm mb-sm bg-primary-fixed">Design Principles</span>
<h1 class="font-headline-md text-headline-md text-on-surface">Which of the following best describes the principle of 'Clarity through Contrast' in modern UI design?</h1>
</div>
<!-- Options (Radio Group mimicking brutalist inputs) -->
<div aria-labelledby="question" class="flex flex-col gap-sm" role="radiogroup">
<label class="relative flex items-center p-sm bg-surface border-2 border-border rounded-lg cursor-pointer hover:-translate-y-[2px] hover:-translate-x-[2px] hover:shadow-[4px_4px_0px_0px_#1E293B] transition-all group">
<input class="peer sr-only" name="quiz_option" type="radio"/>
<div class="w-6 h-6 rounded-full border-2 border-border flex items-center justify-center mr-sm group-hover:border-primary peer-checked:border-primary peer-checked:bg-primary transition-colors">
<div class="w-2.5 h-2.5 rounded-full bg-surface scale-0 peer-checked:scale-100 transition-transform"></div>
</div>
<span class="font-body-lg text-body-lg text-on-surface group-hover:text-primary transition-colors">Using multiple bright colors to draw attention to every element equally.</span>
</label>
<label class="relative flex items-center p-sm bg-surface border-2 border-border rounded-lg cursor-pointer hover:-translate-y-[2px] hover:-translate-x-[2px] hover:shadow-[4px_4px_0px_0px_#1E293B] transition-all group">
<input class="peer sr-only" name="quiz_option" type="radio"/>
<div class="w-6 h-6 rounded-full border-2 border-border flex items-center justify-center mr-sm group-hover:border-primary peer-checked:border-primary peer-checked:bg-primary transition-colors">
<div class="w-2.5 h-2.5 rounded-full bg-surface scale-0 peer-checked:scale-100 transition-transform"></div>
</div>
<span class="font-body-lg text-body-lg text-on-surface group-hover:text-primary transition-colors">Relying solely on subtle drop shadows to create depth without borders.</span>
</label>
<label class="relative flex items-center p-sm bg-surface border-2 border-border rounded-lg cursor-pointer hover:-translate-y-[2px] hover:-translate-x-[2px] hover:shadow-[4px_4px_0px_0px_#1E293B] transition-all group">
<input checked="" class="peer sr-only" name="quiz_option" type="radio"/>
<!-- Active State styling simulated here since we can't rely on JS for peer selection visual complex styling easily without it getting messy -->
<div class="absolute inset-0 border-2 border-primary rounded-lg pointer-events-none"></div>
<div class="w-6 h-6 rounded-full border-2 border-primary bg-primary flex items-center justify-center mr-sm transition-colors">
<div class="w-2.5 h-2.5 rounded-full bg-surface scale-100 transition-transform"></div>
</div>
<span class="font-body-lg text-body-lg text-primary font-medium transition-colors">Utilizing deep, defined borders and stark color differences to clearly delineate hierarchy and structure.</span>
</label>
<label class="relative flex items-center p-sm bg-surface border-2 border-border rounded-lg cursor-pointer hover:-translate-y-[2px] hover:-translate-x-[2px] hover:shadow-[4px_4px_0px_0px_#1E293B] transition-all group">
<input class="peer sr-only" name="quiz_option" type="radio"/>
<div class="w-6 h-6 rounded-full border-2 border-border flex items-center justify-center mr-sm group-hover:border-primary peer-checked:border-primary peer-checked:bg-primary transition-colors">
<div class="w-2.5 h-2.5 rounded-full bg-surface scale-0 peer-checked:scale-100 transition-transform"></div>
</div>
<span class="font-body-lg text-body-lg text-on-surface group-hover:text-primary transition-colors">Avoiding high contrast to ensure a soft, low-energy user experience.</span>
</label>
</div>
</div>
<!-- Action Area -->
<div class="mt-lg flex justify-end">
<button class="h-[60px] px-8 rounded-full bg-primary-container text-on-primary font-label-md text-label-md border-2 border-border shadow-[6px_6px_0px_0px_#FBBF24] hover:shadow-[8px_8px_0px_0px_#FBBF24] hover:-translate-y-[2px] hover:-translate-x-[2px] active:translate-y-[2px] active:translate-x-[2px] active:shadow-none transition-all flex items-center gap-2">

</button>
